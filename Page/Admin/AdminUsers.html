<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users | DonorConnect</title><link rel="stylesheet" href="../Design/Style.css"><link rel="stylesheet" href="../Design/Admin.css"></head>
<body class="admin-users"><header class="site-header"><div class="brand">🩸 DonorConnect</div><span>Administrator Portal</span></header>
<nav class="topnav"><a href="AdminDashboard.html">Dashboard</a><a href="AdminUsers.html">Users</a><a href="AdminCoordinators.html">Coordinators</a><a href="AdminReports.html">Reports</a><a href="AdminLogin.html">Logout</a></nav><main class="container">
<h2>User Management</h2><p class="muted">Search, filter and manage sample user accounts.</p>
<section class="card">
  <div class="filters">
    <input id="searchUser" placeholder="Search name, email or ID">
    <select id="roleFilter"><option value="">All roles</option><option>Donor</option><option>Requester</option><option>Coordinator</option><option>Administrator</option></select>
    <select id="statusFilter"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select>
  </div>
  <p id="userCount" class="muted"></p>
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>City</th><th>Status</th><th>Action</th></tr></thead><tbody id="userRows"></tbody></table></div>
</section>
<section class="card"><h3>Add User</h3>
<form id="addUserForm" novalidate>
  <label for="userName">Full name</label><input id="userName"><p class="error" id="userNameError"></p>
  <label for="userEmail">Email</label><input id="userEmail" type="email"><p class="error" id="userEmailError"></p>
  <label for="userRole">Role</label><select id="userRole"><option value="">Choose role</option><option>Donor</option><option>Requester</option><option>Coordinator</option><option>Administrator</option></select><p class="error" id="userRoleError"></p>
  <label for="userCity">City</label><select id="userCity"><option value="">Choose city</option><option>Dhaka</option><option>Chattogram</option><option>Sylhet</option><option>Rajshahi</option><option>Khulna</option><option>Barishal</option><option>Rangpur</option><option>Mymensingh</option></select><p class="error" id="userCityError"></p>
  <button class="btn" type="submit">Add user</button><p id="addUserFeedback" class="message"></p>
</form></section>
</main><footer class="site-footer">DonorConnect · Frontend demonstration only · Medical staff decide donor eligibility.</footer>
<script src="../JS/Common.js"></script><script src="../JS/Admin/AdminUsers.js"></script></body></html>
