<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find Donors | DonorConnect</title>
    <link rel="stylesheet" href="../Design/Style.css">
    <script src="../JS/Common.js" defer></script>
    <script src="../JS/Coordinator/CoordinatorSearch.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>DonorConnect</h1>
        <p>Donation Coordinator</p>
    </header>
    <nav class="topnav" aria-label="Main navigation">
        <a href="CoordinatorLogin.html">Login</a>
        <a href="CoordinatorDashboard.html">Dashboard</a>
        <a href="CoordinatorSearch.html">Find Donors</a>
        <a href="CoordinatorReview.html">Review Requests</a>
        <a href="CoordinatorSchedule.html">Schedule</a>
    </nav>
    <main>
        <h2>Find Donors</h2>
        <section class="card">
            <form id="searchForm" novalidate>
                <div class="row">
                    <div>
                        <label for="nameFilter">Name</label>
                        <input id="nameFilter" type="text" placeholder="Letters only">
                    </div>
                    <div>
                        <label for="bloodFilter">Blood group</label>
                        <select id="bloodFilter">
                            <option value="">Any blood group</option>
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>
                        </select>
                    </div>
                    <div>
                        <label for="cityFilter">City</label>
                        <select id="cityFilter">
                            <option value="">Any city</option>
                        </select>
                    </div>
                </div>
                <p class="error" id="nameFilterError"></p>
                <label>
                    <input id="availableFilter" type="checkbox"> Only show available donors
                </label>
                <p class="error" id="filterError"></p>
                <button type="submit">Search</button>
                <p id="resultCount" aria-live="polite"></p>
            </form>
        </section>

        <section class="card">
            <h3>Search results</h3>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Donor ID</th>
                            <th>Name</th>
                            <th>Blood group</th>
                            <th>City</th>
                            <th>Availability</th>
                            <th>Contact</th>
                        </tr>
                    </thead><tbody id="donorRows"></tbody>
                </table></div>
            </section>
        </main>
    </body>
</html)
