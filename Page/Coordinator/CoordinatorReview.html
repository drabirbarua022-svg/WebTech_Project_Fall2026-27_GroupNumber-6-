<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review Requests | DonorConnect</title>
    <link rel="stylesheet" href="../../Design/CoordinatorStyle.css">
    <script src="../../JS/Common.js" defer></script>
    <script src="../../JS/Coordinator/CoordinatorReview.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>DonorConnect</h1>
        <p>Donation Coordinator</p>
    </header>
    <nav class="topnav" aria-label="Main navigation">
        <a href="CoordinatorLogin.html">Login</a>
        <a href="CoordinatorDashboard.html">Dashboard</a>
        <a href="CoordinatorSearch.html">Find Donors</a>
        <a href="CoordinatorReview.html">Review Requests</a>
        <a href="CoordinatorSchedule.html">Schedule</a>
    </nav>
    <main>
        <h2>Review Requests</h2>
        <section class="stats">
            <div class="stat">Pending<strong id="countPending">0</strong></div>
            <div class="stat">Under review<strong id="countReview">0</strong></div>
            <div class="stat">Closed<strong id="countClosed">0</strong></div>
        </section>
        <section class="card">
            <h3>Requests</h3>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Blood</th>
                            <th>City</th>
                            <th>Urgency</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="requestRows"></tbody>
                </table>
            </div>
        </section>
        <section class="card" id="detailPanel">
            <h3>Request details</h3>
            <p id="requestDetails">Choose Review beside a request.</p>
            <form id="reviewForm" novalidate>
                <label for="newStatus">New status</label>
                <select id="newStatus">
                    <option value="">Choose status</option>
                    <option>Under Review</option>
                    <option>Needs More Information</option>
                    <option>Closed</option>
                </select>
                <p class="error" id="newStatusError"></p>

                <label for="remarks">Remarks</label>
                <textarea id="remarks" maxlength="250" placeholder="Add a note for this demo"></textarea>
                <p class="error" id="remarksError"></p>

                <button type="submit">Save review</button>

                <p id="reviewMessage" class="message" aria-live="polite"></p>

            </form>

        </section>

    </main>
</body>

</html>
